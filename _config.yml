title: "ElPioterro's Solo Transcriptions"
email: your-email@example.com
description: >-
  My personal collection of transcribed solos from various songs across different 
  genres and instruments. Each transcription includes detailed analysis and playing tips.
baseurl: "/blog"
url: ""
twitter_username: elpioterro
github_username: elpioterro

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Custom collections
collections:
  transcriptions:
    output: true
    permalink: /:collection/:name

# Default front matter for posts and transcriptions
defaults:
  - scope:
      path: ""
      type: "transcriptions"
    values:
      layout: "transcription"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
